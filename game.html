<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Colour Prediction Game</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:#fff;
}

.header{

background:#1e293b;
padding:15px;

display:flex;
justify-content:space-between;
align-items:center;

}

.wallet{

font-size:20px;
font-weight:bold;
color:#22c55e;

}

.round{

text-align:center;
margin:20px 0;

}

.round h2{

font-size:30px;

}

.timer{

font-size:60px;
color:#facc15;
font-weight:bold;

}

.container{

padding:20px;

}

.betbox{

background:#1e293b;
padding:20px;
border-radius:15px;
margin-bottom:20px;

}

input{

width:100%;
padding:14px;
font-size:18px;

border:none;
border-radius:10px;

margin-top:10px;

}

.grid{

display:grid;
grid-template-columns:repeat(3,1fr);
gap:15px;
margin-top:20px;

}

button{

padding:18px;
font-size:20px;

border:none;
border-radius:12px;

color:white;
cursor:pointer;

}

.red{

background:#ef4444;

}

.green{

background:#22c55e;

}

.violet{

background:#8b5cf6;

}

.history{

background:#1e293b;

padding:20px;

border-radius:15px;

margin-top:20px;

}

.results{

display:flex;

gap:10px;

justify-content:center;

margin-top:15px;

}

.ball{

width:45px;
height:45px;

border-radius:50%;

display:flex;

justify-content:center;

align-items:center;

font-weight:bold;

}

.r{

background:#ef4444;

}

.g{

background:#22c55e;

}

.v{

background:#8b5cf6;

}

.back{

margin-top:25px;

width:100%;

background:#2563eb;

}

</style>

</head>

<body>

<div class="header">

<div class="wallet">

Wallet :
<span id="wallet">

₹0

</span>

</div>

<div>

Round :

<span id="round">

0

</span>

</div>

</div>

<div class="round">

<div class="timer" id="timer">

30

</div>

<p>Seconds Remaining</p>

</div>

<div class="container">

<div class="betbox">

<h2>Place Bet</h2>

<input
type="number"
id="betAmount"
placeholder="Enter Bet Amount">

<div class="grid">

<button
class="green"
onclick="placeBet('GREEN')">

GREEN

</button>

<button
class="violet"
onclick="placeBet('VIOLET')">

VIOLET

</button>

<button
class="red"
onclick="placeBet('RED')">

RED

</button>

</div>

</div>

<div class="history">

<h2>Last Results</h2>

<div
class="results"
id="results">

<div class="ball g">

G

</div>

<div class="ball r">

R

</div>

<div class="ball v">

V

</div>

<div class="ball g">

G

</div>

<div class="ball r">

R

</div>

</div>

</div>

<button
class="back"
onclick="location.href='dashboard.html'">

Back

</button>

</div>

<script type="module" src="game.js"></script>

</body>

</html>
