<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Dashboard</title>

<link rel="stylesheet" href="style.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.header{

display:flex;
justify-content:space-between;
align-items:center;

padding:15px;

background:#1e293b;

}

.profile{

display:flex;
align-items:center;
gap:10px;

}

.profile img{

width:50px;
height:50px;
border-radius:50%;
border:2px solid #3b82f6;
object-fit:cover;

}

.wallet{

background:#16a34a;
padding:8px 15px;
border-radius:10px;
font-weight:bold;

}

.container{

padding:20px;

}

.card{

background:#1e293b;
border-radius:15px;
padding:20px;
margin-bottom:15px;
text-align:center;

}

.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;

}

.menu{

background:#2563eb;
padding:25px;
border-radius:15px;
font-size:18px;
cursor:pointer;

transition:.3s;

}

.menu:hover{

background:#1d4ed8;

}

.logout{

margin-top:20px;
width:100%;
padding:15px;
background:#dc2626;
border:none;
border-radius:12px;
font-size:18px;
color:white;
cursor:pointer;

}

</style>

</head>

<body>

<div class="header">

<div class="profile">

<img
id="profileImage"
src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

<div>

<h3 id="userName">Loading...</h3>

<small id="userEmail"></small>

</div>

</div>

<div
class="wallet"
id="wallet">

₹0

</div>

</div>

<div class="container">

<div class="card">

<h2>Colour Prediction</h2>

<p>Realtime Multiplayer Game</p>

</div>

<div class="grid">

<div
class="menu"
onclick="goTo('game.html')">

🎮

<br><br>

Play Game

</div>

<div
class="menu"
onclick="goTo('history.html')">

📜

<br><br>

History

</div>

<div
class="menu"
onclick="goTo('wallet.html')">

💰

<br><br>

Wallet

</div>

<div
class="menu"
onclick="goTo('profile.html')">

👤

<br><br>

Profile

</div>

</div>

<button
class="logout"
onclick="logout()">

Logout

</button>

</div>

<script type="module" src="script.js"></script>

</body>

</html>
