<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>My Profile</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#0f172a;
color:white;
}

.header{
background:#1e293b;
padding:15px;
text-align:center;
font-size:22px;
font-weight:bold;
}

.container{
max-width:500px;
margin:20px auto;
padding:20px;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
}

.center{
text-align:center;
margin-bottom:20px;
}

#profileImage{
width:130px;
height:130px;
border-radius:50%;
border:4px solid #2563eb;
object-fit:cover;
background:white;
}

input[type=file]{
margin-top:15px;
color:white;
}

label{
display:block;
margin-top:15px;
margin-bottom:6px;
font-size:15px;
}

input[type=text],
input[type=email]{

width:100%;
padding:12px;
border:none;
border-radius:10px;
font-size:16px;
outline:none;

}

button{

width:100%;
padding:14px;
margin-top:18px;
border:none;
border-radius:10px;
font-size:17px;
cursor:pointer;
color:white;

}

#saveBtn{
background:#16a34a;
}

#saveBtn:hover{
background:#15803d;
}

#backBtn{
background:#2563eb;
}

#backBtn:hover{
background:#1d4ed8;
}

#status{

margin-top:15px;
text-align:center;
font-weight:bold;

}

</style>

</head>

<body>

<div class="header">

My Profile

</div>

<div class="container">

<div class="card">

<div class="center">

<img

id="profileImage"

src="https://cdn-icons-png.flaticon.com/512/149/149071.png">

<br>

<input

type="file"

id="photo"

accept="image/*">

</div>

<label>

Full Name

</label>

<input

type="text"

id="name"

placeholder="Enter your name">

<label>

Email Address

</label>

<input

type="email"

id="email"

readonly>

<button id="saveBtn">

Save Profile

</button>

<button
id="backBtn"
onclick="goTo('dashboard.html')">

Back to Dashboard

</button>

<div id="status"></div>

</div>

</div>

<script type="module" src="script.js"></script>

<script type="module" src="profile.js"></script>

</body>

</html>
