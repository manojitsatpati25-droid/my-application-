<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Register</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#2563eb;
}

.box{

width:360px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.3);

}

h2{

text-align:center;
margin-bottom:20px;
color:#2563eb;

}

input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;

}

button{

width:100%;
padding:12px;
margin-top:15px;
background:#16a34a;
border:none;
color:#fff;
font-size:17px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#15803d;

}

#msg{

margin-top:15px;
text-align:center;
font-weight:bold;
color:red;

}

p{

margin-top:20px;
text-align:center;

}

a{

text-decoration:none;
color:#2563eb;
font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h2>Create Account</h2>

<input
type="text"
id="name"
placeholder="Full Name">

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<input
type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button id="registerBtn">

Register

</button>

<div id="msg"></div>

<p>

Already have an account?

<a href="index.html">

Login

</a>

</p>

</div>

<script type="module" src="register.js"></script>

</body>
</html>
