<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Colour Prediction Login</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#2563eb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{

width:360px;
background:#fff;
padding:25px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.3);

}

h2{

text-align:center;
margin-bottom:20px;
color:#2563eb;

}

input{

width:100%;
padding:12px;
margin:10px 0;
border-radius:8px;
border:1px solid #ccc;
font-size:16px;

}

button{

width:100%;
padding:12px;
margin-top:15px;
background:#2563eb;
border:none;
color:white;
font-size:17px;
border-radius:8px;
cursor:pointer;

}

button:hover{

background:#1d4ed8;

}

#msg{

margin-top:15px;
text-align:center;
color:red;
font-weight:bold;

}

p{

margin-top:20px;
text-align:center;

}

a{

text-decoration:none;
color:#2563eb;
font-weight:bold;

}

</style>

</head>

<body>

<div class="box">

<h2>Login</h2>

<input
type="email"
id="email"
placeholder="Email Address">

<input
type="password"
id="password"
placeholder="Password">

<button id="loginBtn">

Login

</button>

<div id="msg"></div>

<p>

Don't have an account?

<a href="register.html">

Register

</a>

</p>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
